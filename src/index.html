<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>720nm</title>
<style>
  :root{--bg:#14141a;--panel:#1d1d26;--fg:#ececf1;--mut:#9a9aab;--acc:#ff5fa2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;min-height:100vh;flex-wrap:wrap}
  main{flex:1 1 480px;display:flex;align-items:center;justify-content:center;padding:16px}
  canvas{max-width:100%;max-height:85vh;border-radius:8px;background:#000}
  aside{flex:0 0 300px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:14px}
  h1{margin:0;font-size:18px}
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  button,label.btn{background:#2a2a36;color:var(--fg);border:1px solid #3a3a4a;border-radius:6px;padding:8px;cursor:pointer;text-align:center;font:inherit}
  button.on{border-color:var(--acc);background:#3a2433}
  button.primary{background:var(--acc);color:#fff;border:0}
  label.row{display:flex;flex-direction:column;gap:4px;color:var(--mut)}
  input[type=range]{width:100%}
  input[type=file]{display:none}
  select{background:#2a2a36;color:var(--fg);border:1px solid #3a3a4a;border-radius:6px;padding:8px;font:inherit}
</style>
</head>
<body>
<main><canvas id="c"></canvas></main>
<aside>
  <h1>720nm</h1>
  <label class="btn">Open photo<input type="file" id="file" accept="image/*"></label>
  <div class="presets" id="presets"></div>
  <label class="row">Foliage glow <input type="range" id="foliage" min="0" max="2" step="0.01" value="1"></label>
  <label class="row">Sky darkening <input type="range" id="sky" min="0" max="1" step="0.01" value="0.5"></label>
  <label class="row">Hue shift <input type="range" id="hue" min="-180" max="180" step="1" value="0"></label>
  <label class="row">Contrast <input type="range" id="contrast" min="0.6" max="1.6" step="0.01" value="1.1"></label>
  <label class="row">Format
    <select id="fmt">
      <option value="png">PNG (lossless)</option>
      <option value="jpeg">JPEG</option>
      <option value="webp">WebP</option>
      <option value="bmp">BMP</option>
      <option value="tiff">TIFF (uncompressed)</option>
    </select>
  </label>
  <label class="row" id="qrow">Quality <input type="range" id="quality" min="0.5" max="1" step="0.01" value="0.92"></label>
  <button class="primary" id="save">Save image</button>
</aside>
<script>
// Each preset maps [N (fake NIR), r, g, b] -> output [R, G, B]
const PRESETS = {
  'Aerochrome': [[1,.15,0,0],[0,.9,.1,0],[0,0,.9,.45]],
  'Goldie':     [[1,0,.1,0],[.7,0,.25,0],[0,.35,0,.35]],
  'Super Color':[[.95,0,.1,0],[.45,0,.4,0],[-.25,0,0,.95]],
  'Chrome':     [[0,0,0,1],[.45,0,.55,0],[.9,.1,0,0]],
  'Deep Blue':  [[0,.3,0,.4],[.2,0,.5,.2],[.7,0,0,.8]],
  'Ember':      [[1,.3,0,0],[.35,0,.2,0],[0,0,.1,.25]],
  'Rosé':       [[.95,.25,.1,0],[.4,.15,.2,0],[.6,.2,.1,.15]],
  'Violet':     [[.6,.25,.1,.1],[.1,.1,.25,0],[.9,.15,.1,.5]],
  'B&W Wood':   [[1,0,0,0],[1,0,0,0],[1,0,0,0]],
};
let current = 'Aerochrome', src = null;
const cv = document.getElementById('c'), ctx = cv.getContext('2d', {willReadFrequently:true});
const $ = id => document.getElementById(id);

function sstep(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)}

function render(){
  if(!src) return;
  const M = PRESETS[current];
  const fol = +$('foliage').value, sky = +$('sky').value, con = +$('contrast').value, hue = +$('hue').value*Math.PI/180;
  const out = new ImageData(new Uint8ClampedArray(src.data), src.width, src.height);
  const d = out.data;
  // hue rotation matrix (YIQ-free, rotation around gray axis)
  const c = Math.cos(hue), s = Math.sin(hue), k = 1/3, q = Math.sqrt(1/3);
  const H = [
    [c+(1-c)*k, k*(1-c)-q*s, k*(1-c)+q*s],
    [k*(1-c)+q*s, c+k*(1-c), k*(1-c)-q*s],
    [k*(1-c)-q*s, k*(1-c)+q*s, c+k*(1-c)]];
  for(let i=0;i<d.length;i+=4){
    const r=d[i]/255, g=d[i+1]/255, b=d[i+2]/255;
    const lum = .3*r+.59*g+.11*b;
    // foliage: green dominates; sky/water: blue dominates
    const f = sstep(.02,.18,g-Math.max(r*.9,b)) ;
    const sk = sstep(.0,.2,b-r) * (1-f);
    let N = lum*(1-sky*sk*.9) + f*fol*(.45+.5*lum) + .12*r*(1-f);
    N = Math.min(1,Math.max(0,N));
    let R=0,G=0,B=0;
    const v=[N,r,g,b], o=[0,0,0];
    for(let ch=0;ch<3;ch++){let a=0;for(let j=0;j<4;j++)a+=M[ch][j]*v[j];o[ch]=a}
    if(hue!==0){
      R=H[0][0]*o[0]+H[0][1]*o[1]+H[0][2]*o[2];
      G=H[1][0]*o[0]+H[1][1]*o[1]+H[1][2]*o[2];
      B=H[2][0]*o[0]+H[2][1]*o[1]+H[2][2]*o[2];
    } else {R=o[0];G=o[1];B=o[2]}
    d[i]  =255*Math.min(1,Math.max(0,(R-.5)*con+.5));
    d[i+1]=255*Math.min(1,Math.max(0,(G-.5)*con+.5));
    d[i+2]=255*Math.min(1,Math.max(0,(B-.5)*con+.5));
  }
  ctx.putImageData(out,0,0);
}

function load(img){
  const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
  cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
  ctx.drawImage(img,0,0,cv.width,cv.height);
  src = ctx.getImageData(0,0,cv.width,cv.height);
  render();
}

function demo(){
  const w=900,h=600,t=document.createElement('canvas');t.width=w;t.height=h;
  const x=t.getContext('2d');
  let gr=x.createLinearGradient(0,0,0,h*.55);gr.addColorStop(0,'#3d7be0');gr.addColorStop(1,'#bfdcff');
  x.fillStyle=gr;x.fillRect(0,0,w,h);
  x.fillStyle='#fff';[[200,120,90],[260,110,70],[620,80,80],[680,95,60]].forEach(([a,b,r])=>{x.beginPath();x.arc(a,b,r,0,7);x.fill()});
  gr=x.createLinearGradient(0,h*.5,0,h);gr.addColorStop(0,'#4f9a3a');gr.addColorStop(1,'#2a6a1f');
  x.fillStyle=gr;x.fillRect(0,h*.55,w,h);
  x.fillStyle='#5b4632';x.fillRect(430,260,26,200);
  [[443,230,110,'#2f8a2a'],[390,270,70,'#3a9a30'],[500,280,75,'#3a9a30']].forEach(([a,b,r,col])=>{x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,7);x.fill()});
  x.fillStyle='#7a7a82';x.fillRect(120,330,120,90);x.fillStyle='#a0453a';x.fillRect(110,300,140,35);
  x.fillStyle='#2b6cb0';x.fillRect(620,420,230,100);
  load(t);
}

const pc=$('presets');
Object.keys(PRESETS).forEach(n=>{
  const b=document.createElement('button');b.textContent=n;if(n===current)b.className='on';
  b.onclick=()=>{current=n;[...pc.children].forEach(x=>x.className=x===b?'on':'');render()};
  pc.appendChild(b);
});
['foliage','sky','hue','contrast'].forEach(i=>$(i).oninput=render);
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>load(img);img.src=URL.createObjectURL(f);
};

function le(n,v){const o=[];for(let i=0;i<n;i++)o.push((v>>>(8*i))&255);return o}
function encodeBMP(){
  const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data,row=(w*3+3)&~3,size=54+row*h;
  const out=new Uint8Array(size);
  out.set([66,77,...le(4,size),0,0,0,0,...le(4,54),...le(4,40),...le(4,w),...le(4,h),1,0,24,0,...le(4,0),...le(4,row*h),...le(4,2835),...le(4,2835),...le(4,0),...le(4,0)]);
  for(let y=0;y<h;y++){let o=54+(h-1-y)*row;for(let x=0;x<w;x++){const i=(y*w+x)*4;out[o++]=d[i+2];out[o++]=d[i+1];out[o++]=d[i]}}
  return new Blob([out],{type:'image/bmp'});
}
function encodeTIFF(){
  const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data,n=w*h*3;
  const entries=[[256,4,1,w],[257,4,1,h],[258,3,3,0],[259,3,1,1],[262,3,1,2],[273,4,1,0],[277,3,1,3],[278,4,1,h],[279,4,1,n],[284,3,1,1]];
  const ifdLen=2+entries.length*12+4, bpsOff=8+ifdLen, dataOff=bpsOff+6;
  const buf=new ArrayBuffer(dataOff+n),dv=new DataView(buf);
  dv.setUint16(0,0x4949,true);dv.setUint16(2,42,true);dv.setUint32(4,8,true);
  dv.setUint16(8,entries.length,true);
  entries.forEach(([t,ty,c,v],i)=>{
    const o=10+i*12;dv.setUint16(o,t,true);dv.setUint16(o+2,ty,true);dv.setUint32(o+4,c,true);
    if(t===258)dv.setUint32(o+8,bpsOff,true);else if(t===273)dv.setUint32(o+8,dataOff,true);
    else if(ty===3)dv.setUint16(o+8,v,true);else dv.setUint32(o+8,v,true);
  });
  dv.setUint32(10+entries.length*12,0,true);
  [8,8,8].forEach((v,i)=>dv.setUint16(bpsOff+i*2,v,true));
  const px=new Uint8Array(buf,dataOff);
  for(let i=0,j=0;i<d.length;i+=4){px[j++]=d[i];px[j++]=d[i+1];px[j++]=d[i+2]}
  return new Blob([buf],{type:'image/tiff'});
}
async function encode(fmt){
  if(fmt==='bmp')return {blob:encodeBMP(),ext:'bmp'};
  if(fmt==='tiff')return {blob:encodeTIFF(),ext:'tif'};
  const mime='image/'+fmt, q=+$('quality').value;
  const blob=await new Promise(r=>cv.toBlob(r,mime,q));
  if(blob&&blob.type===mime)return {blob,ext:fmt==='jpeg'?'jpg':fmt};
  alert(fmt.toUpperCase()+' export is not supported on this platform. Saved as PNG instead.');
  return {blob:await new Promise(r=>cv.toBlob(r,'image/png')),ext:'png'};
}
const fmtSel=$('fmt');
fmtSel.onchange=()=>{$('qrow').style.display=(fmtSel.value==='jpeg'||fmtSel.value==='webp')?'flex':'none'};
fmtSel.onchange();
$('save').onclick=async()=>{
  if(!src)return;
  const {blob,ext}=await encode(fmtSel.value);
  const name='720nm-'+current.toLowerCase().replace(/\W+/g,'-')+'.'+ext;
  const T=window.__TAURI__;
  if(T&&T.dialog&&T.fs){
    const path=await T.dialog.save({defaultPath:name,filters:[{name:ext.toUpperCase(),extensions:[ext]}]});
    if(!path)return;
    await T.fs.writeFile(path,new Uint8Array(await blob.arrayBuffer()));
    return;
  }
  const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(blob);a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
};
demo();
</script>
</body>
</html>
